[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ricoh-collector"
version = "3.1.0"
description = "SNMP-overvåking for Ricoh-kopimaskiner"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ricoh Monitor Team" }
]
dependencies = [
    "puresnmp>=1.5.1",
    "paramiko>=3.4.0",
]

[project.scripts]
ricoh-collector = "ricoh_collector.main:main"

[tool.setuptools.packages.find]
where = ["src"]
